<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="draw uno card using html and css">
  <meta name="author" content="Moamal Alaa">
  <meta name="keywords"
    content="uno cards, cards, play cards, colored cards, html css javascript, css draw, creative css cards">
  <link rel="shortcut icon" href="https://img.icons8.com/officel/80/null/paint-palette.png" type="image/x-icon">
  <title>UNO Cards</title>
  <!-- Main css file -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <section class="uno-container">
    <h2 class="title">Menu cards</h2>
    <div class="menu-cards">

      <div class="card-body red-card">
        <div class="center-circle">
          <div class="uno-word">UNO
            <div class="on-letter-u"></div>
            <div class="on-letter-n"></div>
            <div class="on-letter-o"></div>
          </div>
        </div>
      </div>

      <div class="card-body green-card">
        <div class="center-circle">
          <div class="green-handshake">
            <div class="thumb-line"></div>
            <div class="paint-green-handshake"></div>
          </div>
          <div class="thumb"></div>

          <div class="container-green-fingers">
            <div class="green-fingers"></div>
            <div class="green-fingers"></div>
            <div class="green-fingers"></div>
            <div class="green-fingers"></div>
          </div>

          <div class="greenyellow-handshake"></div>

          <div class="container-greenyellow-fingers">
            <div class="greenyellow-fingers"></div>
            <div class="greenyellow-fingers"></div>
            <div class="greenyellow-fingers"></div>
            <div class="greenyellow-fingers"></div>
          </div>

          <div class="shadow"></div>
          <div class="light-shadow-parts"></div>

          <div class="lights-green-handshake"></div>

        </div>
      </div>

      <div class="card-body yellow-card">
        <div class="center-circle">
          <div class="container-records">

            <div class="_2nd-box">
              <p>2</p>
              <div class="box-shadow"></div>
            </div>

            <div class="_1st-box">
              <p>1</p>
              <div class="box-shadow"></div>
            </div>

            <div class="_3rd-box">
              <p>3</p>
              <div class="box-shadow"></div>

            </div>
          </div>
        </div>
      </div>

      <div class="card-body cyan-card">
        <div class="center-circle">
          <div class="medal">

            <div class="circle">
              <p>UNO</p>
              <div class="triangle"></div>
              <div class="triangle2"></div>
              <div class="triangle3"></div>
              <div class="triangle4"></div>
              <div class="triangle5"></div>
              <div class="triangle6"></div>
            </div>

            <div class="fabric">
              <div class="fabric-left"></div>
              <div class="fabric-right"></div>
            </div>

          </div>
        </div>
      </div>

    </div>

    <h2 class="title">Play cards</h2>
    <div class="game-cards menu-cards"></div>
  </section>
  <script src="script.js"></script>
</body>

</html>
